# Settings shared by every environment. Connection details live in application-<profile>.yml.
spring:
  application:
    name: flashdrop
  profiles:
    default: local

  jpa:
    # Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks that
    # the entities match it and refuses to start if they don't. It never changes tables itself.
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
